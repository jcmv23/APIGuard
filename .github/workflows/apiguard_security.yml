name: APIGuard Enterprise Security Gate

on:
  pull_request:
    branches: [ "main", "production" ]
  push:
    branches: [ "main" ]

jobs:
  # ── Unit Tests ─────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: pytest -v --tb=short

  # ── Security Scan Gate ─────────────────────
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Spin Up Sandbox Environment
        run: |
          python sandbox_api.py &
          sleep 5

      - name: APIGuard Security Audit & Gate
        run: |
          python apiguard_cli.py --url http://localhost:8080 --spec openapi.json

      - name: Publish APIGuard Metrics
        if: always()
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  APIGuard Enterprise Security Gate — Complete"
          echo "  Review logs above for threat intelligence details."
          echo "══════════════════════════════════════════════════════"
