name: APIGuard CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Start backend and Run tests
        run: |
          python -m uvicorn api_server:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          echo "Waiting for server to start..."
          sleep 10
          echo "=== Server Logs before tests ==="
          cat uvicorn.log
          echo "================================"
          pytest tests/ -v --tb=short || { echo "=== Pytest Failed. Final Server Logs ==="; cat uvicorn.log; exit 1; }
        env:
          DATABASE_URL: sqlite:///./test.db
