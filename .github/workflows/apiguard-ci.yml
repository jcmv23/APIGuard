# ─────────────────────────────────────────────
# APIGuard Enterprise — GitHub Actions Reusable Workflow
# ─────────────────────────────────────────────
# Usage in your project's .github/workflows/security.yml:
#
#   jobs:
#     api-security:
#       uses: your-org/apiguard/.github/workflows/apiguard-ci.yml@main
#       with:
#         target_url: https://staging-api.example.com
#         fail_on: HIGH
#       secrets:
#         APIGUARD_TOKEN: ${{ secrets.APIGUARD_TOKEN }}

name: APIGuard CI Security Gate

on:
  workflow_call:
    inputs:
      target_url:
        description: 'API URL to scan'
        required: true
        type: string
      fail_on:
        description: 'Minimum severity to fail the pipeline (CRITICAL, HIGH, MEDIUM, LOW)'
        required: false
        type: string
        default: 'HIGH'
      modules:
        description: 'Comma-separated list of modules to run'
        required: false
        type: string
        default: 'bola,bfla,auth,rate,injection,ssl,graphql,data_exposure'
      apiguard_url:
        description: 'APIGuard server URL'
        required: false
        type: string
        default: 'http://localhost:8000'
    secrets:
      APIGUARD_TOKEN:
        description: 'APIGuard API token for authentication'
        required: false

jobs:
  security-scan:
    name: API Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Run APIGuard Scan
        id: scan
        run: |
          echo "🔒 APIGuard Enterprise — CI Security Gate"
          echo "Target: ${{ inputs.target_url }}"
          echo "Fail on: ${{ inputs.fail_on }}"
          
          # Start scan
          RESPONSE=$(curl -s -X POST "${{ inputs.apiguard_url }}/api/v1/ci/scan" \
            -H "Content-Type: application/json" \
            -d '{
              "url": "${{ inputs.target_url }}",
              "modules": "${{ inputs.modules }}",
              "fail_on": "${{ inputs.fail_on }}"
            }')
          
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"
          
          # Extract exit code
          EXIT_CODE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('exit_code', 1))" 2>/dev/null || echo "1")
          
          # Save SARIF
          echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          sarif = data.get('sarif', {})
          with open('apiguard-results.sarif', 'w') as f:
              json.dump(sarif, f, indent=2)
          " 2>/dev/null || true
          
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apiguard-results.sarif
          category: apiguard
        continue-on-error: true

      - name: Security Gate Decision
        run: |
          if [ "${{ steps.scan.outputs.exit_code }}" = "0" ]; then
            echo "✅ Security gate PASSED"
          else
            echo "❌ Security gate FAILED — vulnerabilities above threshold"
            exit 1
          fi
